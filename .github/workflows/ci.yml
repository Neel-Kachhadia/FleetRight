name: FleetRight foundation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler libssl-dev \
            libgtest-dev clang-format clang-tidy clang
      - name: Install Python checks
        run: python -m pip install pytest==9.1.1 ruff==0.15.20
      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: C++ tests
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Python tests and static checks
        env:
          PYTHONPATH: python
        run: |
          python -m pytest -q
          ruff check python workloads scripts
      - name: C++ formatting and static analysis
        run: |
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
          clang-tidy -p build -checks='-*,bugprone-*,performance-*,portability-*' \
            cpp/src/planner.cpp cpp/src/verifier.cpp cpp/benchmarks/core_benchmark.cpp
      - name: ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DFLEETRIGHT_ENABLE_SANITIZERS=ON
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
      - name: Fuzz parser and resource arithmetic
        env:
          PYTHONPATH: python
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ -DFLEETRIGHT_BUILD_FUZZERS=ON
          cmake --build build-fuzz --target resource_fuzz fleetright-plan --parallel 2
          mkdir -p /tmp/fleetright-fuzz-corpus
          python - <<'PY'
          from pathlib import Path
          from fleetright.contracts import encode_profile, encode_snapshot
          from fleetright.scenario import demo_snapshot_fields
          fields = demo_snapshot_fields()
          snapshot, _ = encode_snapshot(fields)
          profile, _ = encode_profile(fields["capacity_profiles"][0])
          Path("/tmp/fleetright-fuzz-corpus/snapshot").write_bytes(snapshot)
          Path("/tmp/fleetright-fuzz-corpus/profile").write_bytes(profile)
          PY
          build-fuzz/fleetright-plan /tmp/fleetright-fuzz-corpus/snapshot /tmp/fleetright-fuzz-corpus/plan
          build-fuzz/resource_fuzz -runs=500 -max_len=65536 /tmp/fleetright-fuzz-corpus
