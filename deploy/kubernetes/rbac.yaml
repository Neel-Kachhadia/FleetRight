apiVersion: v1
kind: Namespace
metadata:
  name: fleetright
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetright-controller
  namespace: fleetright
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetright-executor
  namespace: fleetright
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cpu-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetright-executor
  namespace: fleetright
subjects:
  - kind: ServiceAccount
    name: fleetright-controller
    namespace: fleetright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetright-executor
