apiVersion: v1
kind: Namespace
metadata:
  name: fleetright
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetright-controller
  namespace: fleetright
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: fleetright-v2
  labels:
    fleetright.io/pod-create-admission: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetright-executor
  namespace: fleetright-v2
rules:
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads"]
    verbs: ["get", "patch"]
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads/status"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetright-executor
  namespace: fleetright-v2
subjects:
  - kind: ServiceAccount
    name: fleetright-controller
    namespace: fleetright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetright-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetright-executor-cluster-access
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["fleetrightworkloads.fleetright.io"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetright-executor-cluster-access
subjects:
  - kind: ServiceAccount
    name: fleetright-controller
    namespace: fleetright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleetright-executor-cluster-access
---
# Server-side limit for the executor's cluster-wide Node `patch` grant: RBAC cannot
# scope a patch to fields, so this policy confines the FleetRight executor to a
# one-way cordon plus fleetright.io/* annotations whose fencing token never decreases.
# Everything else on the Node
# (taints, labels, finalizers, uncordon) stays denied for this identity.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleetright-executor-node-mutation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [nodes]
  matchConditions:
    - name: fleetright-executor-only
      expression: request.userInfo.username == 'system:serviceaccount:fleetright:fleetright-controller'
  validations:
    - expression: >-
        object.spec.?unschedulable.orValue(false) == true &&
        object.spec.?taints == oldObject.spec.?taints &&
        object.spec.?providerID == oldObject.spec.?providerID &&
        object.spec.?podCIDRs == oldObject.spec.?podCIDRs &&
        object.spec.?configSource == oldObject.spec.?configSource &&
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
        object.metadata.?annotations.orValue({}).all(k,
          k.startsWith('fleetright.io/') ||
          (k in oldObject.metadata.?annotations.orValue({}) &&
           oldObject.metadata.?annotations.orValue({})[k] == object.metadata.annotations[k])) &&
        oldObject.metadata.?annotations.orValue({}).all(k,
          k.startsWith('fleetright.io/') || k in object.metadata.?annotations.orValue({})) &&
        (!('fleetright.io/fencing-token' in oldObject.metadata.?annotations.orValue({})) ||
          !('fleetright.io/fencing-token' in object.metadata.?annotations.orValue({})) ||
          int(object.metadata.annotations['fleetright.io/fencing-token']) >=
          int(oldObject.metadata.annotations['fleetright.io/fencing-token']))
      message: FleetRight executor may only cordon a Node and write fleetright.io/ annotations.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleetright-executor-node-mutation
spec:
  policyName: fleetright-executor-node-mutation
  validationActions: [Deny]
