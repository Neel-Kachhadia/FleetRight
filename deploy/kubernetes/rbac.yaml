apiVersion: v1
kind: Namespace
metadata:
  name: fleetright
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetright-controller
  namespace: fleetright
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: fleetright-v2
  labels:
    fleetright.io/pod-create-admission: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetright-executor
  namespace: fleetright-v2
rules:
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads"]
    resourceNames: ["cpu-api"]
    verbs: ["get", "patch"]
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads/status"]
    resourceNames: ["cpu-api"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetright-executor
  namespace: fleetright-v2
subjects:
  - kind: ServiceAccount
    name: fleetright-controller
    namespace: fleetright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetright-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetright-executor-crd-reader
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["fleetrightworkloads.fleetright.io"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetright-executor-crd-reader
subjects:
  - kind: ServiceAccount
    name: fleetright-controller
    namespace: fleetright
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleetright-executor-crd-reader
