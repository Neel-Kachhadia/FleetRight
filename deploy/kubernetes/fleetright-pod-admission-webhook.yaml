apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetright-pod-admission
  namespace: fleetright-v2
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetright-pod-admission
  namespace: fleetright-v2
rules:
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads"]
    verbs: ["get"]
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetright-pod-admission
  namespace: fleetright-v2
subjects:
  - kind: ServiceAccount
    name: fleetright-pod-admission
    namespace: fleetright-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetright-pod-admission
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetright-pod-admission-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetright-pod-admission-node-reader
subjects:
  - kind: ServiceAccount
    name: fleetright-pod-admission
    namespace: fleetright-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleetright-pod-admission-node-reader
---
apiVersion: v1
kind: Service
metadata:
  name: fleetright-pod-admission
  namespace: fleetright-v2
spec:
  selector:
    app.kubernetes.io/name: fleetright-pod-admission
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetright-pod-admission
  namespace: fleetright-v2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetright-pod-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetright-pod-admission
    spec:
      serviceAccountName: fleetright-pod-admission
      automountServiceAccountToken: true
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleetright-pod-admission
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission
          image: fleetright-workload-controller:local
          imagePullPolicy: IfNotPresent
          command: [python]
          args: [-m, fleetright.pod_admission]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_ADMISSION_EXECUTOR_USERNAME
              value: system:serviceaccount:fleetright:fleetright-controller
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /var/run/fleetright-webhook
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: fleetright-pod-admission-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleetright-pod-admission
  namespace: fleetright-v2
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetright-pod-admission
