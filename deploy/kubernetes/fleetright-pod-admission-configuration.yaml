apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: fleetright-pod-admission
webhooks:
  - name: pod-create.fleetright.io
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    namespaceSelector:
      matchLabels:
        fleetright.io/pod-create-admission: enabled
    clientConfig:
      caBundle: __CA_BUNDLE__
      service:
        name: fleetright-pod-admission
        namespace: fleetright-v2
        path: /validate-pod-create
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods, pods/eviction, pods/binding]
        scope: Namespaced
