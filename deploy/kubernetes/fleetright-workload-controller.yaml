apiVersion: v1
kind: Namespace
metadata:
  name: fleetright-v2
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetright-workload-controller
  namespace: fleetright-v2
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleetright-workload-controller
  namespace: fleetright-v2
rules:
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads"]
    verbs: ["get", "list"]
  - apiGroups: ["fleetright.io"]
    resources: ["fleetrightworkloads/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetright-workload-controller
  namespace: fleetright-v2
subjects:
  - kind: ServiceAccount
    name: fleetright-workload-controller
    namespace: fleetright-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleetright-workload-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetright-workload-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetright-workload-node-reader
subjects:
  - kind: ServiceAccount
    name: fleetright-workload-controller
    namespace: fleetright-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleetright-workload-node-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetright-workload-controller
  namespace: fleetright-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetright-workload-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetright-workload-controller
    spec:
      serviceAccountName: fleetright-workload-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: fleetright-workload-controller:local
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
