services:
  cpu-service:
    build:
      context: .
      dockerfile: workloads/Dockerfile
    command: ["python", "/app/service.py"]
    environment:
      WORKLOAD_MODE: cpu
      SERVICE_MS: "4"
      SERVICE_DISTRIBUTION: jittered
      COLD_START_MS: "3000"
      LATENCY_SLO_MS: "120"
    ports: ["127.0.0.1:8081:8080"]
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    user: "10001:10001"
    init: true
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  memory-service:
    build:
      context: .
      dockerfile: workloads/Dockerfile
    command: ["python", "/app/service.py"]
    environment:
      WORKLOAD_MODE: memory
      SERVICE_MS: "3"
      MEMORY_BYTES: "33554432"
      SERVICE_DISTRIBUTION: jittered
      COLD_START_MS: "4000"
      LATENCY_SLO_MS: "150"
    ports: ["127.0.0.1:8082:8080"]
    cpus: 1.0
    mem_limit: 768m
    read_only: true
    user: "10001:10001"
    init: true
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  queued-service:
    build:
      context: .
      dockerfile: workloads/Dockerfile
    command: ["python", "/app/service.py"]
    environment:
      WORKLOAD_MODE: queued
      SERVICE_MS: "6"
      MAX_CONCURRENCY: "32"
      QUEUE_WAIT_MS: "100"
      COLD_START_MS: "5000"
      LATENCY_SLO_MS: "80"
    ports: ["127.0.0.1:8083:8080"]
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    user: "10001:10001"
    init: true
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
